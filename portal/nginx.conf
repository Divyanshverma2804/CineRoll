server {
    listen 80;
    server_name localhost;

    # Support large video/audio/image uploads
    client_max_body_size 500M;

    # Increase timeouts for long-running uploads and renders
    proxy_read_timeout 300s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;

    # Frontend SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API requests → backend
    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_pass_header WWW-Authenticate;
        client_max_body_size 500M;
    }

    # Rendered video output
    location /output/ {
        proxy_pass http://backend:8001/output/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_pass_header WWW-Authenticate;
    }

    # Uploaded media assets (images/videos) — FIX: now maps to /assets_local/ on backend
    location /assets_local/ {
        proxy_pass http://backend:8001/assets_local/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_pass_header WWW-Authenticate;
    }

    # Voice file streaming (play endpoint is an API route under /api/)
    # Static voice files served via /voices_files/ backend mount
    location /voices_files/ {
        proxy_pass http://backend:8001/voices_files/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_pass_header WWW-Authenticate;
    }

    # SFX files
    location /sfx/ {
        proxy_pass http://backend:8001/sfx/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_pass_header WWW-Authenticate;
    }
}
